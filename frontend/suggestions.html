<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formations suggérées</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .suggestions-wrapper { max-width: 980px; margin: 0 auto; padding: 24px; }
        .suggestions-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
        .suggestions-intro { color: #555; margin: 8px 0 24px; }
        .gaps-panel { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 12px; padding: 16px 20px; margin-bottom: 28px; }
        .gaps-panel h2 { margin-top: 0; font-size: 1.1rem; }
        .gap-item { margin-bottom: 12px; }
        .gap-item .gap-obj { font-weight: 600; }
        .gap-item .gap-summary { color: #444; }
        .suggestion-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 20px 22px; margin-bottom: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); cursor: pointer; transition: box-shadow 0.15s, transform 0.15s, border-color 0.15s; }
        .suggestion-card:hover { box-shadow: 0 6px 18px rgba(67,56,202,0.12); transform: translateY(-2px); border-color: #c7d2fe; }
        .suggestion-card h3 { margin: 0 0 6px; }
        .view-hint { margin-top: 12px; font-size: 0.85rem; color: #4338ca; font-weight: 600; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; padding: 30px 16px; overflow-y: auto; }
        .modal-overlay.open { display: block; }
        .modal-box { background: #fff; max-width: 860px; margin: 0 auto; border-radius: 14px; padding: 24px 28px; position: relative; }
        .modal-box .modal-close { position: absolute; top: 14px; right: 18px; font-size: 1.6rem; line-height: 1; cursor: pointer; color: #6b7280; background: none; border: none; }
        .modal-box h2 { margin: 0 28px 4px 0; }
        .modal-box .modal-content-text { white-space: pre-wrap; font-family: inherit; line-height: 1.6; color: #374151; margin-top: 16px; }
        .suggestion-badge { display: inline-block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; background: #eef2ff; color: #4338ca; border-radius: 999px; padding: 3px 10px; margin-bottom: 10px; }
        .suggestion-rationale { color: #374151; line-height: 1.55; }
        .rank-num { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #4338ca; color: #fff; font-weight: 700; margin-right: 10px; }
        .loading, .error, .empty { text-align: center; padding: 40px; color: #666; }
        .error { color: #b91c1c; }
        .query-note { font-size: 0.85rem; color: #6b7280; margin-top: 18px; font-style: italic; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

        /* Generated scenarios */
        .gen-section { margin-top: 36px; }
        .gen-section > h2 { border-top: 2px solid #e5e7eb; padding-top: 26px; }
        .gen-intro { color: #555; margin: -4px 0 20px; }
        .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.5); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -3px; margin-right: 8px; }
        .gen-loading { text-align: center; padding: 30px; color: #4338ca; font-weight: 600; }
        .gen-loading .spinner { border-color: rgba(67,56,202,0.25); border-top-color: #4338ca; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .situation-block { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 20px 22px; margin-bottom: 22px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .situation-block > h3 { margin: 0 0 6px; }
        .situation-text { color: #4b5563; line-height: 1.55; white-space: pre-wrap; margin: 6px 0 18px; padding-bottom: 16px; border-bottom: 1px dashed #e5e7eb; }
        .scenario-item { background: #fff8f1; border: 1px solid #fde3c7; border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
        .scenario-item:last-child { margin-bottom: 0; }
        .scenario-label { font-weight: 700; color: #c2410c; margin-bottom: 8px; }
        .scenario-line { line-height: 1.55; color: #374151; margin: 4px 0; }
        .scenario-line .lab { font-weight: 600; color: #9a3412; }
        .gap-chips { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
        .gap-chip { font-size: 0.72rem; background: #eef2ff; color: #4338ca; border-radius: 999px; padding: 3px 9px; }
        .reasoning-toggle { margin-top: 10px; }
        .reasoning-toggle summary { cursor: pointer; font-size: 0.85rem; color: #6b7280; font-weight: 600; }
        .reasoning-toggle .reasoning-text { margin-top: 8px; font-size: 0.88rem; color: #4b5563; line-height: 1.5; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="suggestions-wrapper">
        <div class="suggestions-header">
            <div>
                <h1>🎯 Formations suggérées</h1>
                <p class="suggestions-intro">Des situations supplémentaires sélectionnées en fonction de vos lacunes d'apprentissage.</p>
            </div>
            <div class="header-actions">
                <button id="create-scenarios-btn" class="primary-btn" onclick="createNewScenarios()" title="Générer de nouveaux scénarios ciblant vos lacunes pour les situations déjà évaluées">
                    🛠️ Créer de nouveaux scénarios
                </button>
                <button class="secondary-btn" onclick="goBackToChat()">← Retour au chat</button>
            </div>
        </div>

        <div id="content">
            <div class="loading">Analyse de vos lacunes et recherche de formations pertinentes…</div>
        </div>

        <div id="generated-scenarios"></div>
    </div>

    <div id="situation-modal" class="modal-overlay" onclick="closeSituationModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeSituationModal()" aria-label="Fermer">&times;</button>
            <span class="suggestion-badge" id="modal-domain"></span>
            <h2 id="modal-title"></h2>
            <div class="modal-content-text" id="modal-content"></div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function getApiUrl() {
            if (window.API_BASE_URL) return window.API_BASE_URL;
            const hostname = window.location.hostname;
            const port = window.location.port;
            const protocol = window.location.protocol;
            if (hostname === 'localhost' && port === '3000') return 'http://localhost:8000';
            const isReplit = hostname.includes('replit.app') || hostname.includes('repl.co') ||
                             hostname.includes('replit.dev') || hostname.includes('riker.replit');
            if (isReplit && port && port !== '8000' && port !== '80' && port !== '443') {
                return `${protocol}//${hostname}:8000`;
            }
            return window.location.origin;
        }

        const API_URL = getApiUrl();
        const sessionId = localStorage.getItem('session_id');
        let currentSuggestions = [];

        function goBackToChat() {
            window.location.href = 'chat.html';
        }

        function openSituationModal(index) {
            const s = currentSuggestions[index];
            if (!s) return;
            document.getElementById('modal-domain').textContent = domainLabel(s.domain);
            document.getElementById('modal-title').textContent = s.title;
            document.getElementById('modal-content').textContent =
                s.content && s.content.trim()
                    ? s.content
                    : "Le contenu détaillé de cette situation n'est pas disponible.";
            document.getElementById('situation-modal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeSituationModal(event) {
            document.getElementById('situation-modal').classList.remove('open');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSituationModal();
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : text;
            return div.innerHTML;
        }

        function domainLabel(domain) {
            const map = { migraine: 'Migraine', grh: 'Gestion des ressources humaines' };
            return map[domain] || domain;
        }

        function render(data) {
            const content = document.getElementById('content');

            if (data.status === 'no_gaps' || !data.suggestions || data.suggestions.length === 0) {
                content.innerHTML = `<div class="empty">
                    <p>${escapeHtml(data.message || "Aucune formation supplémentaire n'a pu être suggérée pour le moment.")}</p>
                </div>`;
                return;
            }

            let html = '';

            // Learning gaps panel
            if (data.gaps && data.gaps.length > 0) {
                html += '<div class="gaps-panel"><h2>Vos lacunes d\'apprentissage identifiées</h2>';
                data.gaps.forEach(gap => {
                    html += `<div class="gap-item">
                        <div class="gap-obj">${escapeHtml(gap.learning_objective)}</div>
                        <div class="gap-summary">${escapeHtml(gap.gap_summary)}</div>
                    </div>`;
                });
                html += '</div>';
            }

            // Suggestions (cards are clickable to reveal the full situation content)
            currentSuggestions = data.suggestions;
            html += '<h2>Situations recommandées pour aller plus loin</h2>';
            data.suggestions.forEach((s, i) => {
                html += `<div class="suggestion-card" onclick="openSituationModal(${i})">
                    <span class="suggestion-badge">${escapeHtml(domainLabel(s.domain))}</span>
                    <h3><span class="rank-num">${i + 1}</span>${escapeHtml(s.title)}</h3>
                    <p class="suggestion-rationale">${escapeHtml(s.rationale)}</p>
                    <div class="view-hint">👁️ Cliquez pour voir la situation et les scénarios →</div>
                </div>`;
            });

            if (data.query) {
                html += `<p class="query-note">Recherche effectuée à partir de : « ${escapeHtml(data.query)} »</p>`;
            }

            content.innerHTML = html;
        }

        async function loadSuggestions() {
            const content = document.getElementById('content');
            if (!sessionId) {
                content.innerHTML = '<div class="error">Aucune session trouvée. Veuillez d\'abord lancer une évaluation.</div>';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/suggest-trainings/${sessionId}`);
                if (response.status === 404) {
                    content.innerHTML = '<div class="empty"><p>Aucune lacune d\'apprentissage disponible pour cette session. Les suggestions sont générées après une évaluation.</p></div>';
                    return;
                }
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();
                render(data);
            } catch (error) {
                console.error('Error loading suggestions:', error);
                content.innerHTML = `<div class="error">
                    <p>Erreur lors du chargement des suggestions.</p>
                    <p style="font-size:0.85rem;">${escapeHtml(error.message)}</p>
                </div>`;
            }
        }

        // ---- Create New Scenarios (gap-focused, inline) ----------------------------

        function scenarioDomainLabel(trainingType) {
            const map = {
                migraine: 'Migraine',
                grh_1st: 'Gestion des ressources humaines',
                nursing_1st: 'Leadership infirmier', nursing_2nd: 'Leadership infirmier',
                leadership_1st: 'Leadership', leadership_2nd: 'Leadership', leadership_3rd: 'Leadership',
            };
            return map[trainingType] || trainingType;
        }

        function renderGeneratedScenarios(data) {
            const container = document.getElementById('generated-scenarios');

            if (data.status === 'no_situations' || !data.situations || data.situations.length === 0) {
                container.innerHTML = `<div class="gen-section"><div class="empty">
                    <p>${escapeHtml(data.message || "Aucun nouveau scénario n'a pu être généré.")}</p>
                </div></div>`;
                return;
            }

            let html = '<div class="gen-section">';
            html += '<h2>🛠️ Nouveaux scénarios ciblant vos lacunes</h2>';
            html += `<p class="gen-intro">Pour ${data.situations.length > 1 ? 'chacune des situations' : 'la situation'} sur lesquelles vous avez été évalué(e), voici de nouveaux scénarios conçus pour travailler vos lacunes d'apprentissage.</p>`;

            data.situations.forEach((sit, si) => {
                html += `<div class="situation-block">
                    <span class="suggestion-badge">${escapeHtml(scenarioDomainLabel(data.training_type))}</span>
                    <h3>Situation ${si + 1} — ${escapeHtml(sit.title)}</h3>
                    <div class="situation-text">${escapeHtml(sit.text)}</div>`;

                if (!sit.scenarios || sit.scenarios.length === 0) {
                    html += `<p class="empty">Aucun scénario généré pour cette situation.</p>`;
                } else {
                    sit.scenarios.forEach((sc, ci) => {
                        html += `<div class="scenario-item">
                            <div class="scenario-label">🟠 Scénario ${ci + 1}</div>
                            <p class="scenario-line"><span class="lab">Si vous pensiez à…</span> ${escapeHtml(sc.hypothesis)}</p>
                            <p class="scenario-line"><span class="lab">Et qu'alors…</span> ${escapeHtml(sc.new_information)}</p>`;
                        if (sc.targeted_learning_gaps && sc.targeted_learning_gaps.length > 0) {
                            html += '<div class="gap-chips">';
                            sc.targeted_learning_gaps.forEach(g => {
                                html += `<span class="gap-chip">🎯 ${escapeHtml(g)}</span>`;
                            });
                            html += '</div>';
                        }
                        if (sc.chain_of_thought && sc.chain_of_thought.trim()) {
                            html += `<details class="reasoning-toggle">
                                <summary>Voir le raisonnement</summary>
                                <div class="reasoning-text">${escapeHtml(sc.chain_of_thought)}</div>
                            </details>`;
                        }
                        html += '</div>';
                    });
                }
                html += '</div>';
            });

            html += '</div>';
            container.innerHTML = html;
        }

        async function createNewScenarios() {
            const btn = document.getElementById('create-scenarios-btn');
            const container = document.getElementById('generated-scenarios');

            if (!sessionId) {
                container.innerHTML = '<div class="gen-section"><div class="error">Aucune session trouvée. Veuillez d\'abord lancer une évaluation.</div></div>';
                return;
            }

            const originalLabel = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Génération…';
            container.innerHTML = '<div class="gen-section"><div class="gen-loading"><span class="spinner"></span> Création de nouveaux scénarios ciblant vos lacunes… cela peut prendre un moment.</div></div>';

            try {
                const response = await fetch(`${API_URL}/create-scenarios/${sessionId}`, { method: 'POST' });
                if (response.status === 404) {
                    container.innerHTML = '<div class="gen-section"><div class="empty"><p>Aucune lacune d\'apprentissage disponible. Les scénarios sont générés après une évaluation.</p></div></div>';
                    return;
                }
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();
                renderGeneratedScenarios(data);
                container.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } catch (error) {
                console.error('Error creating scenarios:', error);
                container.innerHTML = `<div class="gen-section"><div class="error">
                    <p>Erreur lors de la génération des scénarios.</p>
                    <p style="font-size:0.85rem;">${escapeHtml(error.message)}</p>
                </div></div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalLabel;
            }
        }

        document.addEventListener('DOMContentLoaded', loadSuggestions);
    </script>
</body>
</html>
